<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KRX MODZ - Whitelist Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #0c0d0e; border: 1px solid #1f2328; border-radius: 12px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
    h1 span { color: #ff3131; }
    input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 12px; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #ff3131; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 14px; font-size: 13px; display: none; }
    a { display: block; margin-top: 16px; color: #888; text-decoration: none; font-size: 13px; }
    #nick-box { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KRX <span>MODZ</span></h1>
    <p style="color: #888; font-size: 13px; margin: 8px 0 20px;">Session Whitelist Portal</p>
    <input type="text" id="uid" placeholder="Player UID" />
    <div id="nick-box">
      <input type="text" id="nick" placeholder="Enter In-Game Nickname" />
    </div>
    <button id="btn" onclick="submitAuth()">ACTIVATE (24 HOURS)</button>
    <div id="status" class="status"></div>
    <a href="/dashboard">Switch to Dashboard &rarr;</a>
  </div>
  <script>
    let firstTime = false;
    async function submitAuth() {
      const uid = document.getElementById('uid').value.trim();
      const nick = document.getElementById('nick').value.trim();
      const st = document.getElementById('status');
      const nb = document.getElementById('nick-box');
      const btn = document.getElementById('btn');
      if (!uid) return;
      const payload = { account_id: uid };
      if (firstTime && nick) payload.nickname = nick;
      const res = await fetch('/api/whitelist', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(r => r.json());
      st.style.display = 'block';
      if (res.requires_nickname) {
        firstTime = true;
        nb.style.display = 'block';
        btn.innerText = 'SET NICKNAME & ACTIVATE';
        st.innerText = 'First time registration! Please enter desired nickname.';
        st.style.color = '#ff3131';
      } else if (res.success) {
        nb.style.display = 'none';
        firstTime = false;
        btn.innerText = 'ACTIVATE (24 HOURS)';
        st.innerText = `UID ${uid} (${res.nickname || 'Active'}) authorized for 24h!`;
        st.style.color = '#00ff00';
      } else {
        st.innerText = res.message || 'Error authorizing.';
        st.style.color = '#ff3131';
      }
    }
  </script>
</body>
</html>
